<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="enviar()">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Entra a administrar tu tienda</p>

    @if (errorMensaje()) {
      <div class="mensaje-error">{{ errorMensaje() }}</div>
    }

    <label>
      Correo
      <input type="email" formControlName="email" placeholder="tucorreo@ejemplo.com" />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" placeholder="••••••••" />
    </label>

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="enlace-secundario">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>
  </form>
</div>
